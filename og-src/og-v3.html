<!doctype html><html><head><meta charset="utf-8">
<!-- Share card for b0-x.com (og-b0x-v3.png, 1200x630). Render: serve the repo root, open /og-src/og-v3.html at 1200x630, screenshot.
     The app windows are the gallery's own screenshots (img/sites/*.webp); only apps whose stage is "live" in sites.json, with the site's "Live" chip. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;background:#050506;color:#f4f1e8;font-family:'Space Grotesk';overflow:hidden;position:relative}
.bg{position:absolute;inset:-40px;background:url(../img/sites-wall.webp) center/cover;filter:blur(16px) brightness(.38) saturate(1.15)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#050506 0%,rgba(5,5,6,.96) 34%,rgba(5,5,6,.6) 58%,rgba(5,5,6,.55) 100%),radial-gradient(60% 70% at 74% 48%,rgba(255,210,77,.16),transparent 70%)}
.l{position:absolute;left:80px;top:64px;bottom:60px;width:520px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;font:700 38px/1 'Space Grotesk';letter-spacing:-.02em}
.brand img{width:27px;height:37px;display:block}
.beta{margin-left:6px;padding:4px 11px;border:1.5px solid rgba(255,210,77,.7);border-radius:999px;color:#ffd24d;font:700 14px/1.2 'IBM Plex Sans';letter-spacing:.14em}
.eye{margin:64px 0 0;font:600 17px/1 'Space Grotesk';letter-spacing:.2em;color:#ffd24d}
h1{margin:20px 0 0;font:700 68px/.98 'Space Grotesk';letter-spacing:-.04em;color:#fff}
h1 b{color:#ffd24d;font-weight:700}
.cta{margin-top:36px;align-self:flex-start;display:inline-flex;align-items:center;gap:12px;padding:15px 28px;border-radius:999px;background:linear-gradient(180deg,#ffe58a,#ffd24d 55%,#e0a800);color:#0a0a0b;font:700 23px/1 'Space Grotesk';letter-spacing:-.01em;box-shadow:0 10px 30px rgba(255,210,77,.22)}
.url{margin-top:auto;font:500 21px/1 'IBM Plex Mono';color:#b0ab9f}
.wall{position:absolute;left:600px;top:-10px;width:650px;height:650px;perspective:1500px}
.grid{position:absolute;left:30px;top:50%;display:grid;grid-template-columns:repeat(3,236px);gap:18px;transform:translateY(-50%) rotateY(-22deg) rotateX(8deg) rotateZ(-3deg);transform-origin:20% 50%;transform-style:preserve-3d}
.win{position:relative;border-radius:12px;overflow:hidden;background:#0b0b0c;border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.win .bar{height:22px;display:flex;align-items:center;gap:5px;padding:0 9px;background:#111113;border-bottom:1px solid rgba(255,255,255,.08);font:500 10.5px/1 'IBM Plex Mono';color:#cfcabd}
.win .bar i{width:7px;height:7px;border-radius:50%;background:#3a3a3e}
.win .bar span{margin-left:6px}
.win .shot{position:relative;height:148px;background:#000}
.win .shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.win.dim{filter:brightness(.62) saturate(.9)}
.win.dim .chip{transform:scale(.9);transform-origin:0 0}
.chip{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 10px;border-radius:999px;background:rgba(10,10,12,.85);border:1px solid rgba(255,255,255,.22);font:600 13px/1 'Space Grotesk';color:#f4f1e8}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#3bd16f;box-shadow:0 0 0 3px rgba(59,209,111,.22)}
.win.c{transform:scale(1.22) translateZ(60px);z-index:5;border:2px solid #ffd24d;box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 50px rgba(255,210,77,.3)}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="l">
  <div class="brand"><img src="../logo.svg" alt=""><span>0-x</span><span class="beta">BETA</span></div>
  <p class="eye">THE bWALLETX FAMILY · LIVE STATUS</p>
  <h1>Every<br><b>bWalletX</b> app,<br>in one place.</h1>
  <div class="cta">Explore the apps <span aria-hidden="true">&rarr;</span></div>
  <div class="url">b0-x.com</div>
</div>
<div class="wall"><div class="grid"><div class="win dim"><div class="bar"><i></i><i></i><i></i><span>bmusicx.com</span></div><div class="shot"><img src="../img/sites/bmusicx.webp" alt=""><span class=chip>Live</span></div></div><div class="win dim"><div class="bar"><i></i><i></i><i></i><span>bchatx.com</span></div><div class="shot"><img src="../img/sites/bchatx.webp" alt=""></div></div><div class="win dim"><div class="bar"><i></i><i></i><i></i><span>bmoviesx.com</span></div><div class="shot"><img src="../img/sites/bmoviesx.webp" alt=""></div></div><div class="win dim"><div class="bar"><i></i><i></i><i></i><span>bgamesx.com</span></div><div class="shot"><img src="../img/sites/bgamesx.webp" alt=""></div></div><div class="win c"><div class="bar"><i></i><i></i><i></i><span>bwalletx.com</span></div><div class="shot"><img src="../img/sites/bwalletx.webp" alt=""><span class=chip>Live</span></div></div><div class="win dim"><div class="bar"><i></i><i></i><i></i><span>bvideox.com</span></div><div class="shot"><img src="../img/sites/bvideox.webp" alt=""></div></div><div class="win dim"><div class="bar"><i></i><i></i><i></i><span>badvertisingx.com</span></div><div class="shot"><img src="../img/sites/badvertisingx.webp" alt=""><span class=chip>Live</span></div></div><div class="win dim"><div class="bar"><i></i><i></i><i></i><span>bphotosx.com</span></div><div class="shot"><img src="../img/sites/bphotosx.webp" alt=""></div></div><div class="win dim"><div class="bar"><i></i><i></i><i></i><span>bfriendsx.com</span></div><div class="shot"><img src="../img/sites/bfriendsx.webp" alt=""></div></div></div></div>
</body></html>
